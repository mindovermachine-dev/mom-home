name: "Project directory entry"
description: "Propose or create a project entry for /projects/"
title: "[project] <project title>"
body:
  - type: markdown
    attributes:
      value: |
        Submit this form to request a project entry in `astro/src/data/project`.

        Assigning this issue to **Copilot** will start a headless implementation
        on a `copilot/**` attached to a Pull Reques. Review the 
        changes, continue the process and approve the review when you're done.
        Submitting the issue does **not** publish content directly.

  - type: input
    id: project_title
    attributes:
      label: Project title
      description: Maps to frontmatter `title`.
      placeholder: <The title of entry in the project directory>
    validations:
      required: true

  - type: input
    id: publish_date
    attributes:
      label: Publish date (UTC)
      description: Maps to frontmatter `publishDate` (ISO 8601).
      placeholder: "YYYY-MM-DD"
    validations:
      required: false

  - type: dropdown
    id: status
    attributes:
      label: Project status
      description: Maps to `project.status`.
      options:
        - "mature"
        - "beta"
        - "lab"
        - "explore"
        - "not-started"
      default: 2
    validations:
      required: false

  - type: textarea
    id: excerpt
    attributes:
      label: Summary / excerpt
      description: Maps to frontmatter `excerpt`.
      placeholder: A short summary used in cards and metadata.
    validations:
      required: true

  - type: textarea
    id: body_markdown
    attributes:
      label: Project body (Markdown)
      description: Preserved as the page body content.
      placeholder: |
        ## Problem
        Explain the problem that needs to be solved.

        ## Solution
        Explain the solution that was implemented.

        ## Value
        Explain the value this solution provides.

        ## Status
        Explain the current status of the project.
    validations:
      required: true

  - type: dropdown
    id: ai_rewrite_intent
    attributes:
      label: AI rewrite intent
      description: Instructs the AI to either rewrite the content or leave it as is (allow spelling/grammar fixes).
      options:
        - "Allow rewrite"
        - "Keep as is"
      default: 1
    validations:
      required: true

  - type: textarea
    id: project_tags
    attributes:
      label: Project tags (filter taxonomy)
      description: One value per line. Maps to `project.tags`.
      placeholder: |
        DevX
        Python
        Internship
    validations:
      required: false

  - type: dropdown
    id: publication_intent
    attributes:
      label: Publication intent
      description: Maps to frontmatter `draft`.
      options:
        - "Publish now (draft: false)"
        - "Keep as draft (draft: true)"
    validations:
      required: true

  - type: input
    id: image_path
    attributes:
      label: Image path or image request
      description: "Use `~/assets/images/...` path, or write a request like `REQUEST: create image for ...`."
      placeholder: ~/assets/images/projects/project-name.png
    validations:
      required: false

  - type: input
    id: slack_channel
    attributes:
      label: Slack channel
      description: Optional. Maps to `project.slack.channel`. Use this setting when the project has a dedicated Slack channel. Otherwise, leave blank to use the default `#project` channel.
    validations:
      required: false

  - type: input
    id: slack_url
    attributes:
      label: Slack URL
      description: Optional. Must be absolute `https://` URLs. Maps to `project.slack.url`. Use this setting when the project has a dedicated Slack channel.
    validations:
      required: false

  - type: textarea
    id: github_repositories
    attributes:
      label: GitHub repositories
      description: Optional. One `owner/name` per line. Maps to `project.github.repositories`.
      placeholder: |
        mindovermachine-dev/gh-tt
        mindovermachine/takt-actions
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. One reference per line in `name | url` format. URL must be `/relative/path/` or absolute `https://`.
      placeholder: |
        Takt | /writings/takt/
        Reference manual | https://mindovermachine.dev/takt/
    validations:
      required: false

  - type: textarea
    id: leads
    attributes:
      label: Leads (profile IDs)
      description: Optional. One profile ID per line. IDs must already exist in the profile collection.
    validations:
      required: false

  - type: textarea
    id: contributors
    attributes:
      label: Contributors (profile IDs)
      description: Optional. One profile ID per line. IDs must already exist in the profile collection and must not duplicate leads.
    validations:
      required: false
