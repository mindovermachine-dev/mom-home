name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy_artifact_to_pages:
    name: Deploy prebuilt artifact to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to download workflow artifacts in a private repo
      statuses: write
      pages: write
      id-token: write
      contents: read # explictly required when repository is private, otherwise optional
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy with takt action
        uses: devx-cafe/takt-actions/deploy-to-repo@v1
        with:
          target_repository: mindovermachine-dev/stage.mindovermachine.dk
          artifact_name: github-pages-${{ github.sha }}
          user_name: "Production Deployer"
          user_email: "deploy@mindovermachine.dk"
          cname: "www.mindovermachine.dk"
          token: ${{ secrets.READY_PUSHER }}
          artifact_path: astro/dist # Default: "_site"
          # target_branch: # Default: "main"
          # status_context: # Default: "deploy:repo"
          # commit_message: # Default: "Deploy artifact from $GITHUB_REPOSITORY@$GITHUB_REF_NAME"
